{# Panel: pemilih kamera. Butuh: cameras #}
<nav class="camera-tabs" aria-label="Pilih kamera" data-panel="camera_tabs" data-refresh="live" data-depends="camera">
  {% for cam in cameras %}
  <button type="button"
          class="camera-tab{% if cam.active %} is-active{% endif %}"
          data-action="select-camera"
          data-camera="{{ cam.id }}"
          data-focus-id="camera-{{ cam.id }}"
          aria-pressed="{{ cam.active|yesno:'true,false' }}">
    <span class="camera-tab__meta"><span class="status-dot status-dot--{{ cam.level }}"></span>{{ cam.id }} · {{ cam.level_label }}</span>
    <span class="camera-tab__name">{{ cam.short }}</span>
  </button>
  {% endfor %}
</nav>
