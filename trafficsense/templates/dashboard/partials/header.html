{# Header: merek, pemilih kamera, penanda mode demo, jam #}
<header class="app-header">
  <div class="brand">
    <div class="brand__logo">{% include "includes/icon.html" with name="road" size=24 %}</div>
    <div>
      <h1 class="brand__name">TrafficSense</h1>
      <p class="brand__tagline">Analitik lalu lintas berbasis CCTV</p>
    </div>
  </div>

  {% include "dashboard/partials/camera_tabs.html" %}

  <div class="app-header__side">
    <button type="button" class="btn btn--ghost btn--icon" data-action="open-add-camera">{% include "includes/icon.html" with name="plus" size=18 %}Tambah kamera</button>
    <span class="pill">Kamera demo: data simulasi</span>
    <div class="clock">
      <div class="clock__time" data-clock>{% now "H:i:s" %}</div>
      <div class="clock__date" data-date>{% now "l, j F Y" %}</div>
    </div>
  </div>
</header>
