{# Panel: pantauan langsung #}
<section class="card feed" data-panel="camera_feed" data-depends="camera" aria-labelledby="feed-title">
  <div class="card__head">
    <div>
      <h2 class="card__title" id="feed-title">Pantauan langsung</h2>
      <p class="card__subtitle">{{ camera.id }} · {{ camera.name }}</p>
    </div>
    {% include "dashboard/components/legend.html" %}
  </div>

  <div class="feed__stage" role="group" aria-label="Pantauan Kamera {{ camera.name }}">
    
    <!-- TAMPILAN VIDEO ASLI RTSP -->
    <div class="feed__stream-container" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background-color: #000;">
      <img id="rtsp-player" 
           src="{% url 'video_feed' camera.id %}?rtsp={{ camera.rtsp_url|urlencode }}" 
           alt="Live Stream {{ camera.name }}"
           style="max-width: 100%; max-height: 100%; object-fit: contain;">
    </div>

    {% include "dashboard/partials/feed_hud.html" %}

    <div class="feed__overlay" role="status" hidden>Menghubungkan ke aliran RTSP…</div>
  </div>

  <form class="feed__source" data-action="reconnect" onsubmit="handleReconnect(event)">
    <label class="field">
      Sumber RTSP
      <input class="input" type="text" id="rtsp-input" name="rtsp" value="{{ camera.rtsp_url }}" spellcheck="false" autocomplete="off">
    </label>
    <button type="submit" class="btn btn--primary" data-reconnect-btn>Hubungkan ulang</button>
  </form>

  <ul class="feed__meta">
    <li>Stream RTSP Live</li>
    <li>MJPEG Response</li>
  </ul>
</section>

<script>
function handleReconnect(e) {
  e.preventDefault();
  const inputUrl = document.getElementById('rtsp-input').value;
  const imgPlayer = document.getElementById('rtsp-player');
  
  // Reload elemen <img> dengan RTSP URL baru & cache buster timestamp
  imgPlayer.src = "{% url 'video_feed' camera.id %}?rtsp=" + encodeURIComponent(inputUrl) + "&t=" + Date.now();
}
</script>
