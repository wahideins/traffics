{% extends "base.html" %}
{% load static %}
{% block title %}Masuk · Pengaturan TrafficSense{% endblock %}
{% block content %}
<main class="admin admin--narrow">
  <form class="card admin-login" method="post" action="{% url 'dashboard:admin_login' %}">
    {% csrf_token %}
    <h1 class="card__title">Pengaturan TrafficSense</h1>
    <p class="card__subtitle">Masukkan sandi admin.</p>
    <label class="form-field"><span class="form-field__label">Sandi</span>
      <input class="input" type="password" name="password" autocomplete="current-password" autofocus required></label>
    {% if error %}<p class="form-status form-status--error">{{ error }}</p>{% endif %}
    <button class="btn btn--primary" type="submit">Masuk</button>
  </form>
</main>
{% endblock %}
